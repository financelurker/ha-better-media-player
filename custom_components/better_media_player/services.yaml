start_follow:
  target:
    entity:
      integration: better_media_player
      domain: media_player

stop_follow:
  target:
    entity:
      integration: better_media_player
      domain: media_player

set_sleep_timer:
  target:
    entity:
      integration: better_media_player
      domain: media_player
  fields:
    minutes:
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
    fade_minutes:
      example: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min

cancel_sleep_timer:
  target:
    entity:
      integration: better_media_player
      domain: media_player

wake:
  target:
    entity:
      integration: better_media_player
      domain: media_player
  fields:
    media_content_id:
      required: true
      example: "library://radio/42"
      selector:
        text:
    media_content_type:
      required: true
      example: music
      selector:
        text:
    start_volume:
      selector:
        select:
          custom_value: true
          translation_key: preset
          options:
            - quiet
            - normal
            - loud
            - party
    target_volume:
      selector:
        select:
          custom_value: true
          translation_key: preset
          options:
            - quiet
            - normal
            - loud
            - party
    fade_minutes:
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    max_duration_minutes:
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
    night_mode:
      selector:
        boolean:
    source:
      selector:
        select:
          translation_key: source
          options:
            - audio
            - video
    follow:
      selector:
        boolean:

snooze:
  target:
    entity:
      integration: better_media_player
      domain: media_player
  fields:
    minutes:
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min

stop_wake:
  target:
    entity:
      integration: better_media_player
      domain: media_player

set_volume_preset:
  target:
    entity:
      integration: better_media_player
      domain: media_player
  fields:
    preset:
      required: true
      selector:
        select:
          translation_key: preset
          options:
            - quiet
            - normal
            - loud
            - party
    fade_seconds:
      example: 3
      selector:
        number:
          min: 0
          max: 300
          step: 0.5
          unit_of_measurement: s

handover:
  target:
    entity:
      integration: better_media_player
      domain: media_player
  fields:
    destination:
      required: true
      selector:
        entity:
          integration: better_media_player
          domain: media_player
    source:
      selector:
        select:
          translation_key: source
          options:
            - audio
            - video
    keep_source_playing:
      default: false
      selector:
        boolean:

announce:
  target:
    entity:
      integration: better_media_player
      domain: media_player
  fields:
    message:
      example: "Dinner is ready"
      selector:
        text:
    media_content_id:
      selector:
        text:
    media_content_type:
      selector:
        text:
    tts_entity:
      selector:
        entity:
          domain: tts
    language:
      selector:
        text:
    volume:
      example: 0.4
      selector:
        text:
    ignore_quiet:
      default: false
      selector:
        boolean:
    pre_announce:
      selector:
        boolean:
